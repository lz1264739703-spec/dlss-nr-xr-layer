; Smoke-test stand-in for the add-on's own config (used by nr-addon-bridge-test.cpp in both trees).
; [Other] proves the section filter, [DlssNr] the alias table; the slots prove the selector
; (AMDNR_XR_ADDON_SLOT=2 is set for the run), and [RenoDX.DLSS5] proves the ReShade add-on's section.
[Other]
LocalTone=9.9
[DlssNr]
Enabled=true
LocalTone=1.25
LocalStructure=1.10
SkinStructure=-0.5
AutoMask=true
Style=natural
TransferStrength=0.80
ColourStrength=0.90
; The AMD-path names for the same two runtime values, written later in the section on purpose: the
; addon's own rule is "the last line wins", so these must come out ahead of TransferStrength above.
AmdDetailStrength=0.85
AmdColourStrength=0.95
Intensity=auto
Passes=2
WorkingScale=0.75
StyleSlot1=LocalTone=0.4;LocalStructure=0.6
StyleSlot2=LocalTone=1.75;SkinStructure=2;AutoMask=false;style=2
StyleSlot3=

; The ReShade add-on's section, for the section rule: only keys inside it count, and this section is
; applied after [DlssNr] above (the slot is applied after the whole file, so it still has the last
; word over both).
[RenoDX.DLSS5]
NRLocalTone=1.30
NRColorStrength=0.70
EnableHooks=1
NRPreset=1